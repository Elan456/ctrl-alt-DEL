[project]
name = "ctrl-alt-del"
version = "0.1.0"
description = "Top-down spaceship sabotage prototype for ctrl-alt-DEL, with DEL as a local LLM opponent."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pygame-ce>=2.5.0",
    "PyYAML>=6.0.0",
]

[project.optional-dependencies]
llm = [
    "llama-cpp-python>=0.3.0",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
play = "ctrl_alt_del.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctrl_alt_del"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
